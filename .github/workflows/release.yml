name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# permissions declaradas por job (principio do menor privilegio)
# create-release e o unico job que precisa escrever no repositorio

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Python unit tests (cross-platform, no audio hardware)
  # ──────────────────────────────────────────────────────────────
  test-python:
    name: Python unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: sidecar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run unit tests (no audio hardware required)
        # test_integration.py requer hardware de audio — executar apenas postprocess
        run: python -m pytest tests/test_postprocess.py -v --tb=short

  # ──────────────────────────────────────────────────────────────
  # Job 2: Build PyInstaller sidecar binary (Windows only)
  # ──────────────────────────────────────────────────────────────
  build-sidecar-windows:
    name: Build sidecar (Windows)
    runs-on: windows-latest
    needs: test-python
    defaults:
      run:
        working-directory: sidecar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Install dependencies + PyInstaller
        run: pip install -r requirements.txt pyinstaller

      - name: Build sidecar binary
        run: pyinstaller scribe4me-sidecar.spec --noconfirm

      - name: Smoke test binary
        # Verifica que o executavel responde a ping via JSON-RPC
        run: |
          echo '{"id":1,"method":"ping","params":{}}' | `
            .\dist\scribe4me-sidecar\scribe4me-sidecar.exe 2>$null | `
            Select-String -Pattern "pong"
        shell: pwsh
        continue-on-error: true  # sounddevice pode falhar em CI sem dispositivo de audio

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-windows
          path: sidecar/dist/scribe4me-sidecar/
          if-no-files-found: error
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 3: Tauri build — Windows (MSI + NSIS)
  # ──────────────────────────────────────────────────────────────
  build-tauri-windows:
    name: Tauri build (Windows)
    runs-on: windows-latest
    needs: build-sidecar-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download sidecar artifact
        uses: actions/download-artifact@v4
        with:
          name: sidecar-windows
          path: sidecar/dist/scribe4me-sidecar/

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Windows)
        run: npm run tauri build -- --bundles nsis,msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 3

  # ──────────────────────────────────────────────────────────────
  # Job 4: Tauri build — macOS (DMG)
  # NOTA: usa macos-14 (arm64 / Apple Silicon) explicitamente.
  # PyPI nao fornece wheels universais para ctranslate2/sounddevice,
  # entao o sidecar compilado e arm64-only. O bundle resultante
  # funciona apenas em Macs Apple Silicon (M1+).
  # Suporte a Macs Intel requer dois jobs separados e dois DMGs.
  # ──────────────────────────────────────────────────────────────
  build-sidecar-macos:
    name: Build sidecar (macOS arm64)
    runs-on: macos-14
    needs: test-python
    defaults:
      run:
        working-directory: sidecar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Install dependencies + PyInstaller
        run: pip install -r requirements.txt pyinstaller

      - name: Build sidecar binary
        run: pyinstaller scribe4me-sidecar.spec --noconfirm

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-macos
          path: sidecar/dist/scribe4me-sidecar/
          if-no-files-found: error
          retention-days: 1

  build-tauri-macos:
    name: Tauri build (macOS arm64)
    runs-on: macos-14
    needs: build-sidecar-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download sidecar artifact
        uses: actions/download-artifact@v4
        with:
          name: sidecar-macos
          path: sidecar/dist/scribe4me-sidecar/

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (macOS universal)
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 3

  # ──────────────────────────────────────────────────────────────
  # Job 5: Tauri build — Linux (AppImage + deb)
  # ──────────────────────────────────────────────────────────────
  build-sidecar-linux:
    name: Build sidecar (Linux)
    runs-on: ubuntu-latest
    needs: test-python
    defaults:
      run:
        working-directory: sidecar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Install system audio libs
        run: sudo apt-get install -y portaudio19-dev libsndfile1

      - name: Install dependencies + PyInstaller
        run: pip install -r requirements.txt pyinstaller

      - name: Build sidecar binary
        run: pyinstaller scribe4me-sidecar.spec --noconfirm

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-linux
          path: sidecar/dist/scribe4me-sidecar/
          if-no-files-found: error
          retention-days: 1

  build-tauri-linux:
    name: Tauri build (Linux)
    runs-on: ubuntu-latest
    needs: build-sidecar-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            portaudio19-dev \
            libsndfile1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download sidecar artifact
        uses: actions/download-artifact@v4
        with:
          name: sidecar-linux
          path: sidecar/dist/scribe4me-sidecar/

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Linux)
        run: npm run tauri build -- --bundles appimage,deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 3

  # ──────────────────────────────────────────────────────────────
  # Job 6: Criar GitHub Release com todos os instaladores
  # ──────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-tauri-windows
      - build-tauri-macos
      - build-tauri-linux
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # necessario para criar GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
